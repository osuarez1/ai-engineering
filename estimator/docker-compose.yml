# Docker Compose configuration for local development.
# For production, remove the bind mount and the --reload flag.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: estimator
      POSTGRES_USER: estimator
      POSTGRES_PASSWORD: estimator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estimator -d estimator"]
      interval: 5s
      timeout: 5s
      retries: 10

  estimator:
    build: .
    container_name: estimator
    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    # Load environment variables (API keys, config) from the local .env file.
    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+asyncpg://estimator:estimator@postgres:5432/estimator

    # Bind-mount source, migrations, corpus, and scripts for live edit / one-off runs.
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./data:/app/data
      - ./query_examples.py:/app/query_examples.py

    # Override the default CMD to enable auto-reload on file changes.
    # Remove --reload for production deployments.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    restart: unless-stopped

    # Health check using Python's stdlib (curl is not available in slim images).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  postgres_data:
